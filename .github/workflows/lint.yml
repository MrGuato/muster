name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1
        with:
          args: .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: scripts

  package:
    name: Package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the .toc and build the zip
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: muster-zip
          path: dist/*.zip
          retention-days: 7

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run the test suite
        run: lua5.1 tests/run.lua

      - name: Build the zip (checks the tag matches the .toc)
        run: bash scripts/package.sh "$GITHUB_REF_NAME"

      - name: Release notes from CHANGELOG.md
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Muster-${GITHUB_REF_NAME#v}.zip" \
            --title "Muster $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

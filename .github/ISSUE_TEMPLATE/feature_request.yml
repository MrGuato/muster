name: Feature request
description: An idea for Muster.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Muster to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What are you trying to do in game? The playerbots command it would use helps too, if you know it.

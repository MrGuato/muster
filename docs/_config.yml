title: Muster
description: A WoW 3.3.5a addon for mod-playerbots. Raise a whole dungeon or raid group in one click, give orders and tune each bot's strategies from one panel.
remote_theme: just-the-docs/just-the-docs
url: https://mrguato.github.io
baseurl: /muster
logo: /assets/logo.svg
favicon_ico: /favicon.ico

# GitHub / social card
image: /assets/social-preview.png

color_scheme: dark

aux_links:
  GitHub:
    - https://github.com/MrGuato/muster
  Download:
    - https://github.com/MrGuato/muster/releases/latest

aux_links_new_tab: true

heading_anchors: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

footer_content: 'Built by <a href="https://github.com/MrGuato">MrGuato</a>. MIT licensed. Not affiliated with Blizzard Entertainment, AzerothCore or mod-playerbots.'

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - assets/social-preview.svg

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

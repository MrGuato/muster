<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Muster: a war banner raised over three helmeted soldiers">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d488"/>
      <stop offset="1" stop-color="#9c7426"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27486a"/>
      <stop offset="1" stop-color="#0c1824"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0473d"/>
      <stop offset="1" stop-color="#7a1d19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3d488" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f3d488" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inner"><rect x="10" y="10" width="108" height="108" rx="14"/></clipPath>
  </defs>

  <!-- gold frame, like a WoW ability icon -->
  <rect x="2" y="2" width="124" height="124" rx="21" fill="#120e07"/>
  <rect x="5" y="5" width="118" height="118" rx="19" fill="url(#gold)"/>
  <rect x="10" y="10" width="108" height="108" rx="14" fill="url(#night)"/>

  <g clip-path="url(#inner)">
    <circle cx="70" cy="42" r="46" fill="url(#glow)"/>

    <!-- banner pole with a gold finial -->
    <rect x="41" y="21" width="5" height="90" rx="2" fill="#aeb6c0"/>
    <rect x="41" y="21" width="1.8" height="90" fill="#ffffff" opacity=".45"/>
    <circle cx="43.5" cy="19.5" r="5.5" fill="url(#gold)" stroke="#5a4214" stroke-width="1"/>

    <!-- swallowtail war banner -->
    <path d="M46 26 H100 L89 43 L100 60 H46 Z" fill="url(#cloth)" stroke="#3f0f0d" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M46 26 H100 L97.5 30 H46 Z" fill="#ffffff" opacity=".18"/>
    <!-- emblem: a gold M -->
    <path d="M56 52 V35 L67.5 45 L79 35 V52" fill="none" stroke="#f3d488" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- the muster: three helmeted soldiers -->
    <path d="M14.0 118 V105.5 Q14.0 96.2 23.4 95.3 H38.6 Q48.0 96.2 48.0 105.5 V118 Z" fill="#2f3b49"/>
    <circle cx="31" cy="88.5" r="7.3" fill="#1b232c"/>
    <path d="M22.5 89.3 A8.5 8.5 0 0 1 39.5 89.3 V96.2 H36.1 V91.9 H25.9 V96.2 H22.5 Z" fill="#7f8995"/>
    <rect x="21.2" y="88.1" width="19.6" height="2.9" rx="1.2" fill="#5b6672"/>
    <rect x="30.0" y="89.3" width="2.0" height="6.0" fill="#7f8995"/>
    <path d="M80.0 118 V105.5 Q80.0 96.2 89.3 95.3 H104.7 Q114.0 96.2 114.0 105.5 V118 Z" fill="#2f3b49"/>
    <circle cx="97" cy="88.5" r="7.3" fill="#1b232c"/>
    <path d="M88.5 89.3 A8.5 8.5 0 0 1 105.5 89.3 V96.2 H102.1 V91.9 H91.9 V96.2 H88.5 Z" fill="#7f8995"/>
    <rect x="87.2" y="88.1" width="19.6" height="2.9" rx="1.2" fill="#5b6672"/>
    <rect x="96.0" y="89.3" width="2.0" height="6.0" fill="#7f8995"/>
    <path d="M44.0 118 V100.0 Q44.0 89.0 55.0 88.0 H73.0 Q84.0 89.0 84.0 100.0 V118 Z" fill="#43525f"/>
    <circle cx="64" cy="80.0" r="8.6" fill="#1b232c"/>
    <path d="M54.0 81.0 A10.0 10.0 0 0 1 74.0 81.0 V89.0 H70.0 V84.0 H58.0 V89.0 H54.0 Z" fill="#b9c1ca"/>
    <rect x="52.5" y="79.5" width="23.0" height="3.4" rx="1.2" fill="url(#gold)"/>
    <rect x="62.8" y="81.0" width="2.4" height="7.0" fill="#b9c1ca"/>
  </g>
</svg>
